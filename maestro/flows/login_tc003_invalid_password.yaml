appId: com.techshop.android
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 10000
- tapOn:
    id: "login-email"
- inputText: "demo@techshop.com"
- tapOn:
    id: "login-password"
- inputText: "wrongpassword123"
- hideKeyboard
- tapOn:
    text: "Log In"
- extendedWaitUntil:
    visible:
      id: "login-error"
    timeout: 10000
- assertVisible:
    id: "login-error"
