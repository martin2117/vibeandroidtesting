name: Appium UI Tests

on:
  push:
    branches: [ "**" ]

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'techshop/reactnative-fixed/package.json'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'appium/requirements.txt'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python Test Dependencies
        run: pip install -r appium/requirements.txt

      - name: Install App Dependencies & Prebuild Android
        working-directory: techshop/reactnative-fixed
        run: |
          npm install
          npx expo prebuild --platform android --clean
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build Debug APK with Gradle
        working-directory: techshop/reactnative-fixed/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install techshop/reactnative-fixed/android/app/build/outputs/apk/debug/app-debug.apk
            bash -c '
              appium --log appium.log &
              APPIUM_PID=$!
              for i in {1..30}; do
                if curl -s http://127.0.0.1:4723/status > /dev/null; then
                  echo "Appium ready"
                  break
                fi
                sleep 1
              done
              pytest appium/tests --junitxml=appium-report.xml
              TEST_EXIT=$?
              kill -9 $APPIUM_PID || true
              exit $TEST_EXIT
            '

      - name: Upload Appium Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report
          path: |
            appium-report.xml
            appium.log
          if-no-files-found: warn
          retention-days: 7
